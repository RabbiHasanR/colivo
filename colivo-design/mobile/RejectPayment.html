<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reject a payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
input::placeholder,textarea::placeholder{color:#6E7673}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="padding: 12px 20px 10px; display: flex; flex-direction: column; gap: 8px">
    <a href="Inbox.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Inbox</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Reject payment</h1>
    <span style="font-size: 13px; color: #5B6461; line-height: 1.45">A reason is required</span>
  </header>
  <main style="flex: 1; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums">
    <section aria-label="Payment" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">Maruf says he paid</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">৳1,240</span></div>
      <span style="font-size: 13px; color: #3E4744">General payment · bKash · TrxID 8K2Q… · today 3:12 pm</span>
      <div role="img" aria-label="Receipt screenshot" style="height: 120px; border-radius: 10px; background: #E8E5DC; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5B6461">bKash receipt · shows ৳1,200</div>
    </section>
    <fieldset style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Reason</legend>
      <span style="font-size: 15px; font-weight: 600">Why isn't it right?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Note for Maruf
        <textarea rows="2" style="border: 1px solid #D6D3C9; border-radius: 10px; padding: 10px 12px; font-size: 15px; color: #17201D; font-family: inherit; resize: none">The receipt shows ৳1,200, not ৳1,240.</textarea>
      </label>
    </fieldset>
    <section style="background: #F1F0EA; border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #3E4744; line-height: 1.5">Nothing changes in Maruf's balance. He gets your reason and can fix the payment and send it again.</section>
    <button type="button" style="min-height: 48px; border: 0; border-radius: 12px; background: #9A4A10; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center">Reject and tell Maruf</button>
    <a href="Inbox.html" style="min-height: 48px; border-radius: 12px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center">Cancel</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { r: 'amount' };
  }
  renderVals() {
    const on = 'min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #9A4A10; background: #FBEFE3; color: #7A3A0C; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer';
    const off = 'min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer';
    const reasons = [['amount', 'Amount doesn\'t match'], ['receipt', 'Receipt not clear'], ['notrec', 'Money not received'], ['purpose', 'Wrong purpose'], ['other', 'Other']].map(([k, label]) => ({
      label, on: this.state.r === k ? 'true' : 'false', style: this.state.r === k ? on : off, pick: () => this.setState({ r: k })
    }));
    return { reasons };
  }
}
</script>
</body>
</html>
