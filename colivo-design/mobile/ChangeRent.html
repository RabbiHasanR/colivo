<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change rent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column">
  <header style="padding: 12px 20px 8px; display: flex; flex-direction: column; gap: 8px">
    <a href="Rent.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Rent</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Change rent</h1>
    <div role="tablist" aria-label="What is changing" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #ECEAE2; border-radius: 12px; padding: 4px; gap: 4px">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; font-variant-numeric: tabular-nums">
    <section aria-label="The change" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{isRoom}}" hint-placeholder-val="{{ false }}">
        <label style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5B6461">Room
          <select style="height: 40px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 8px; font-size: 14px; color: #17201D; background: #FFFFFF; font-family: inherit"><option>Room B · 2 people</option><option>Room A · 1 person</option></select>
        </label>
      </sc-if>
      <sc-if value="{{isMember}}" hint-placeholder-val="{{ false }}">
        <label style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5B6461">Member
          <select style="height: 40px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 8px; font-size: 14px; color: #17201D; background: #FFFFFF; font-family: inherit"><option>Hijam Shusil</option><option>Rabbi Hasan</option><option>Maruf</option></select>
        </label>
      </sc-if>
      <div style="display: flex; gap: 8px; align-items: center">
        <div role="group" aria-label="Direction" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; flex: 1">
          <button aria-pressed="{{upOn}}" onClick="{{setUp}}" style="{{upStyle}}">Increase</button>
          <button aria-pressed="{{downOn}}" onClick="{{setDown}}" style="{{downStyle}}">Decrease</button>
        </div>
        <div style="display: flex; align-items: center; background: #F6F5F0; border-radius: 10px">
          <button aria-label="Less by ৳100" onClick="{{minus}}" style="width: 36px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #17201D">−</button>
          <span style="min-width: 64px; text-align: center; font-size: 15px; font-weight: 600">৳{{amountText}}</span>
          <button aria-label="More by ৳100" onClick="{{plus}}" style="width: 36px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #0E6656">+</button>
        </div>
      </div>
      <label style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5B6461">Starts from
        <select style="height: 40px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 8px; font-size: 14px; color: #17201D; background: #FFFFFF; font-family: inherit"><option>December 2026</option><option>November 2026</option><option>January 2027</option></select>
      </label>
    </section>

    <section aria-label="{{choiceLabel}}" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #5B6461">{{choiceLabel}}</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{choices}}" as="c" hint-placeholder-count="2">
          <button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </section>

    <section aria-label="Preview" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 4px 14px; display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 70px; gap: 6px; padding: 10px 0 6px; font-size: 11px; color: #5B6461">
        <span>Preview</span><span style="text-align: right">Now</span><span style="text-align: right">New</span><span style="text-align: right">Change</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 70px; gap: 6px; padding: 9px 0; border-top: 1px solid #EFEDE6; font-size: 13px; align-items: center">
          <span style="font-weight: 500">{{r.name}}</span>
          <span style="text-align: right; color: #5B6461">{{r.old}}</span>
          <span style="text-align: right; font-weight: 600">{{r.next}}</span>
          <span style="text-align: right; font-weight: 600; color: {{r.color}}">{{r.diff}}</span>
        </div>
      </sc-for>
      <div style="display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid #E3E1D9; font-size: 12px; color: #5B6461">
        <span>Landlord rent</span><span style="font-weight: 600; color: #17201D">{{landlord}}</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0 0 10px; font-size: 12px">
        <span style="color: #5B6461">Members vs landlord</span><span style="font-weight: 600; color: {{gapColor}}">{{gapText}}</span>
      </div>
    </section>

    <span style="font-size: 12px; color: #5B6461; line-height: 1.45">{{note}}</span>

    <button style="height: 48px; border: 0; border-radius: 12px; background: #0E6656; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer">{{cta}}</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scope: 'flat', up: true, amount: 1200, method: 'equal', policy: 'fund' };
  }
  fmt(n) {
    return '৳' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  renderVals() {
    const s = this.state;
    const tabOn = 'height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit';
    const tabOff = 'height: 40px; border: 0; border-radius: 9px; background: transparent; color: #5B6461; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit';
    const segOn = 'height: 44px; border-radius: 10px; border: 1.5px solid #0E6656; background: #E3F0EC; color: #0E6656; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit';
    const segOff = 'height: 44px; border-radius: 10px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit';
    const chipOn = 'min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #0E6656; background: #E3F0EC; color: #0E6656; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit';
    const chipOff = 'min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit';

    const scopes = [['flat', 'Whole home'], ['room', 'One room'], ['member', 'One member']].map(([k, label]) => ({
      label, on: s.scope === k ? 'true' : 'false', style: s.scope === k ? tabOn : tabOff,
      pick: () => this.setState({ scope: k })
    }));

    const members = [
      { name: 'Rabbi Hasan', room: 'A', rent: 6670 },
      { name: 'Hijam Shusil', room: 'B', rent: 3887.5 },
      { name: 'Maruf', room: 'B', rent: 3887.5 }
    ];
    const L = 15645;
    const total = members.reduce((a, m) => a + m.rent, 0);
    const d = (s.up ? 1 : -1) * s.amount;
    let next = members.map((m) => m.rent);
    let newL = L;
    let note = '';
    let choices = [];
    let choiceLabel = '';

    if (s.scope === 'flat') {
      newL = L + d;
      if (s.method === 'equal') {
        next = members.map((m) => m.rent + d / members.length);
        note = 'Every member ' + (d >= 0 ? 'pays ' : 'saves ') + this.fmt(d / members.length) + ' a month.';
      } else {
        const p = d / total;
        next = members.map((m) => m.rent * (1 + p));
        note = 'Every member\'s rent moves by ' + (Math.abs(p) * 100).toFixed(1) + '%, so bigger rooms change more.';
      }
      choiceLabel = 'How to share it';
      choices = [['equal', 'Same amount each'], ['percent', 'Same percent']].map(([k, label]) => ({
        label, on: s.method === k ? 'true' : 'false', style: s.method === k ? chipOn : chipOff,
        pick: () => this.setState({ method: k })
      }));
    } else {
      const targeted = s.scope === 'room' ? members.map((m) => m.room === 'B') : members.map((m) => m.name === 'Hijam Shusil');
      const tCount = targeted.filter(Boolean).length;
      next = members.map((m, i) => targeted[i] ? m.rent + d / tCount : m.rent);
      const others = members.map((m, i) => !targeted[i]);
      const oTotal = members.reduce((a, m, i) => a + (others[i] ? m.rent : 0), 0);
      const oCount = others.filter(Boolean).length;
      if (s.policy === 'equal') {
        next = next.map((r, i) => others[i] ? r - d / oCount : r);
        note = 'The others ' + (d < 0 ? 'cover' : 'share') + ' the ' + this.fmt(d) + ' equally, so the landlord rent is still fully covered.';
      } else if (s.policy === 'share') {
        next = next.map((r, i) => others[i] ? r - d * (members[i].rent / oTotal) : r);
        note = 'The others ' + (d < 0 ? 'cover' : 'share') + ' the ' + this.fmt(d) + ' in proportion to their rent.';
      } else if (s.policy === 'fund') {
        note = d < 0 ? 'The home fund pays the extra ' + this.fmt(d) + ' every month.' : 'The extra ' + this.fmt(d) + ' a month stays in the home fund.';
      } else {
        note = 'Every member must agree in the app. Until then, the old rent stays.';
      }
      choiceLabel = 'Who covers the difference (your default: Home fund)';
      choices = [['equal', 'Others equally'], ['share', 'By rent share'], ['fund', 'Home fund'], ['ask', 'Ask members']].map(([k, label]) => ({
        label, on: s.policy === k ? 'true' : 'false', style: s.policy === k ? chipOn : chipOff,
        pick: () => this.setState({ policy: k })
      }));
    }

    const rows = members.map((m, i) => {
      const diff = next[i] - m.rent;
      const tiny = Math.abs(diff) < 0.005;
      return {
        name: m.name,
        old: this.fmt(m.rent),
        next: this.fmt(next[i]),
        diff: tiny ? '—' : (diff > 0 ? '+' : '−') + this.fmt(diff).replace('৳', ''),
        color: tiny ? '#5B6461' : (diff > 0 ? '#9A4A10' : '#0E6656')
      };
    });
    const newTotal = next.reduce((a, r) => a + r, 0);
    const gap = newL - newTotal;
    let gapText = 'Matches';
    let gapColor = '#0E6656';
    if (gap > 0.005) { gapText = this.fmt(gap) + ' short'; gapColor = '#9A4A10'; }
    if (gap < -0.005) { gapText = this.fmt(gap) + ' extra'; gapColor = '#0E6656'; }

    return {
      scopes,
      isRoom: s.scope === 'room',
      isMember: s.scope === 'member',
      upOn: s.up ? 'true' : 'false',
      downOn: s.up ? 'false' : 'true',
      upStyle: s.up ? segOn : segOff,
      downStyle: s.up ? segOff : segOn,
      setUp: () => this.setState({ up: true }),
      setDown: () => this.setState({ up: false }),
      plus: () => this.setState({ amount: s.amount + 100 }),
      minus: () => this.setState({ amount: Math.max(100, s.amount - 100) }),
      amountText: s.amount.toLocaleString('en-US'),
      choices,
      choiceLabel,
      rows,
      landlord: this.fmt(newL) + (newL !== L ? ' (was ' + this.fmt(L) + ')' : ''),
      gapText,
      gapColor,
      note,
      cta: s.scope !== 'flat' && s.policy === 'ask' ? 'Send to members' : 'Confirm change'
    };
  }
}
</script>
</body>
</html>
