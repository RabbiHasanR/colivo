<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills and categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
input::placeholder{color:#6E7673}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column">
  <header style="padding: 12px 20px 10px; display: flex; flex-direction: column; gap: 6px">
    <a href="Settings.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Home settings</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Bills &amp; categories</h1>
    <span style="font-size: 13px; color: #5B6461">Every bill is split equally unless there's a custom deal</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; font-size: 12px; color: #5B6461; line-height: 1.45">An <strong style="color: #17201D; font-weight: 600">estimate</strong> is optional. Members see their share from the 1st; the actual bill replaces it. Used every month; change it for one month on Utilities.</p>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <section aria-label="{{g.name}}" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: {{g.bg}}; color: {{g.fg}}">{{g.name}}</span>
          <span style="font-size: 12px; color: #5B6461">{{g.help}}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
            <button type="button" aria-label="{{i.name}}, {{i.est}}" style="min-height: 44px; border: 0; font-family: inherit; color: #17201D; text-align: left; padding: 6px 12px; border-radius: 10px; background: #F6F5F0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">{{i.name}}</span><span style="font-size: 11px; color: {{i.estColor}}">{{i.est}}</span></button>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <form aria-label="Add a bill" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Add a bill</h2>
      <div style="display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Name
          <input type="text" placeholder="e.g. Water, Generator" style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 12px; font-size: 15px; color: #17201D; font-family: inherit; box-sizing: border-box; min-width: 0">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Group
          <select style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 8px; font-size: 14px; color: #17201D; background: #FFFFFF; font-family: inherit"><option>Postpaid</option><option>Prepaid</option><option>Rent</option><option>Other</option></select>
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Estimate every month (optional)
        <input type="text" inputmode="decimal" placeholder="৳ leave empty for actual bill only" style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 12px; font-size: 15px; color: #17201D; font-family: inherit; box-sizing: border-box; min-width: 0">
      </label>
      <button type="submit" style="height: 48px; border: 0; border-radius: 12px; background: #0E6656; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit">Add bill</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // est: optional default estimate used every month (FR-100); null = charged only when the actual bill is entered
    const bill = (name, est) => ({
      name,
      est: est ? 'Est. ৳' + est + ' / month' : 'Actual bill only',
      estColor: est ? '#0E6656' : '#5B6461'
    });
    return {
      groups: [
        { name: 'Rent', help: 'Paid to the landlord', bg: '#ECEAE2', fg: '#3E4744', items: [bill('Landlord rent', null)] },
        { name: 'Prepaid', help: 'Paid before you use it', bg: '#E7F1FB', fg: '#1D4F86', items: [bill('Electricity', null), bill('Gas', null), bill('Internet', '1,050')] },
        { name: 'Postpaid', help: 'Paid after the month', bg: '#EFEDFF', fg: '#4B3FA3', items: [bill('Cook (cook)', '2,500'), bill('Service charge', null)] },
        { name: 'Other', help: 'One-off costs', bg: '#F1F0EA', fg: '#3E4744', items: [bill('Household', null), bill('Ad-hoc', null)] }
      ]
    };
  }
}
</script>
</body>
</html>
