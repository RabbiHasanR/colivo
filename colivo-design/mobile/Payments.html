<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column">
  <header style="padding: 20px 20px 10px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 13px; color: #5B6461">Manager</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Record payment</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 12px">
    <form aria-label="Payment" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Member
        <select style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 10px; font-size: 15px; color: #17201D; background: #FFFFFF; font-family: inherit">
          <option>Maruf · owes ৳1,240.00</option>
          <option>Rabbi Hasan · credit ৳293.65</option>
          <option>Hijam Shusil · credit ৳3,713.77</option>
        </select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Received by
        <select style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 10px; font-size: 15px; color: #17201D; background: #FFFFFF; font-family: inherit">
          <option>Me (Rabbi) · saved now</option>
          <option>Hijam Shusil · he confirms</option>
        </select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Amount (৳)
        <input type="text" inputmode="decimal" value="1,240.00" style="height: 52px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 12px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #17201D; box-sizing: border-box">
      </label>
      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 12px; color: #5B6461; padding: 0; margin-bottom: 8px">Category</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
            <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </fieldset>
      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 12px; color: #5B6461; padding: 0; margin-bottom: 8px">Method</legend>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
          </sc-for>
        </div>
      </fieldset>
      <button type="button" style="height: 64px; border-radius: 10px; border: 1.5px dashed #9A4A10; background: #FFFFFF; color: #7A3A0C; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">+ Receipt, screenshot or photo (required)</button>
      <div style="background: {{hintBg}}; color: {{hintColor}}; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45">{{hint}}</div>
      <button type="submit" style="height: 48px; border: 0; border-radius: 12px; background: #0E6656; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit">{{cta}}</button>
    </form>

    <section aria-label="Recent payments" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 4px 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Rabbi Hasan · Rent</span><span style="color: #5B6461; font-size: 12px">5 Oct · bKash</span></div>
        <span style="font-weight: 600">৳6,670</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #EFEDE6; font-size: 13px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Hijam Shusil · Refund</span><span style="color: #5B6461; font-size: 12px">Today · bKash · <span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #FBEFE3; color: #7A3A0C">Waiting for Hijam</span></span></div>
        <span style="font-weight: 600">−৳2,000</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #EFEDE6; font-size: 13px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Hijam Shusil · Rent</span><span style="color: #5B6461; font-size: 12px">4 Oct · Cash</span></div>
        <span style="font-weight: 600">৳4,000</span>
      </div>
    </section>
  </main>

  <nav aria-label="Main" style="height: 68px; background: #FFFFFF; border-top: 1px solid #E3E1D9; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Meals.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Meals</a>
    <a href="Bazar.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16l-2 10H6z"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="16" cy="20" r="1.4"></circle><path d="M4 6L3 3"></path></svg>Expenses</a>
    <a href="Payments.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E6656; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Payments</a>
    <a href="Statement.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18l-5-3-5 3z"></path><path d="M10 8h4M10 12h4"></path></svg>Statement</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'General', method: 'bKash' };
  }
  renderVals() {
    const chipOn = 'min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #0E6656; background: #E3F0EC; color: #0E6656; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer';
    const chipOff = 'min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer';
    const boxOn = 'min-height: 44px; border-radius: 10px; border: 1.5px solid #0E6656; background: #E3F0EC; color: #0E6656; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer';
    const boxOff = 'min-height: 44px; border-radius: 10px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer';
    const catList = ['General', 'Rent', 'Prepaid utility', 'Postpaid utility', 'Deposit', 'Refund'];
    const cats = catList.map((c) => ({
      label: c,
      on: this.state.cat === c ? 'true' : 'false',
      style: this.state.cat === c ? chipOn : chipOff,
      pick: () => this.setState({ cat: c })
    }));
    const methods = ['Cash', 'bKash', 'Nagad', 'Bank'].map((m) => ({
      label: m,
      on: this.state.method === m ? 'true' : 'false',
      style: this.state.method === m ? boxOn : boxOff,
      pick: () => this.setState({ method: m })
    }));
    const hints = {
      'General': 'Credits Maruf\'s overall balance. Clears the ৳1,240.00 due.',
      'Rent': 'Credits Maruf\'s rent for October.',
      'Prepaid utility': 'Credits Maruf\'s prepaid utility share.',
      'Postpaid utility': 'Credits Maruf\'s postpaid utility share.',
      'Deposit': 'Goes to Maruf\'s deposit ledger, not this month\'s balance. Required: ৳7,775.00.',
      'Refund': 'Maruf has no credit to refund. Refunds also need enough money in the home fund (৳1,620 free). A refund counts only after the member confirms they received it.'
    };
    const isRefund = this.state.cat === 'Refund';
    return {
      cats,
      methods,
      hint: hints[this.state.cat],
      hintBg: isRefund ? '#FBEFE3' : '#F1F0EA',
      hintColor: isRefund ? '#7A3A0C' : '#3E4744',
      cta: isRefund ? 'Pay refund' : 'Save payment'
    };
  }
}
</script>
</body>
</html>
