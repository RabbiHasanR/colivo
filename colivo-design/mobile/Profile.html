<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
input::placeholder{color:#6E7673}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column">
  <header style="padding: 12px 20px 6px">
    <a href="Main.html" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Home</a>
  </header>

  <main style="flex: 1; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums">
    <section aria-label="Me" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 6px">
      <div style="position: relative">
        <div aria-hidden="true" style="width: 84px; height: 84px; border-radius: 999px; background: #E7F1FB; color: #1D4F86; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600">RH</div>
        <button aria-label="Change photo" style="position: absolute; right: -4px; bottom: -2px; width: 34px; height: 34px; border-radius: 999px; border: 2px solid #F6F5F0; background: #0E6656; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        </button>
      </div>
      <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600">Rabbi Hasan</h1>
      <span style="font-size: 13px; color: #5B6461">Owner · Manager · Room A</span>
      <span style="font-size: 12px; color: #5B6461">Member since September 2026</span>
    </section>

    <section aria-label="My details" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">My details</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Phone
          <input type="tel" placeholder="01XXXXXXXXX" style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 12px; font-size: 15px; color: #17201D; font-family: inherit; box-sizing: border-box; min-width: 0">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Email (optional)
          <input type="email" placeholder="name@email.com" style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 12px; font-size: 15px; color: #17201D; font-family: inherit; box-sizing: border-box; min-width: 0">
        </label>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px; border-top: 1px solid #EFEDE6">
        <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 8px">
          <span style="font-size: 14px; font-weight: 500">ID document</span>
          <span style="font-size: 12px; color: #0E6656; font-weight: 600">NID · uploaded ✓</span>
        </div>
        <button style="min-height: 40px; padding: 0 12px; margin-top: 8px; border-radius: 999px; border: 1px solid #0E6656; background: #FFFFFF; color: #0E6656; font-size: 13px; font-weight: 600; font-family: inherit">View</button>
      </div>
    </section>

    <nav aria-label="My money" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 0 14px; display: flex; flex-direction: column">
      <a href="MyBill.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; min-height: 44px; text-decoration: none; color: #17201D">
        <span style="font-size: 14px; font-weight: 500">My bill</span><span style="font-size: 14px; font-weight: 600; color: #0E6656">+৳293.65 credit ›</span>
      </a>
      <a href="Advance.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; min-height: 44px; border-top: 1px solid #EFEDE6; text-decoration: none; color: #17201D">
        <span style="font-size: 14px; font-weight: 500">My deposit</span><span style="font-size: 14px; font-weight: 600">৳13,340 ›</span>
      </a>
      <a href="GiveNotice.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; min-height: 44px; border-top: 1px solid #EFEDE6; text-decoration: none; color: #17201D">
        <span style="font-size: 14px; font-weight: 500">Give notice to leave</span><span aria-hidden="true" style="font-size: 18px; color: #5B6461">›</span>
      </a>
    </nav>

    <section aria-label="Preferences" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Preferences</h2>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 14px">Language</span>
        <div role="group" aria-label="Language" style="display: flex; background: #ECEAE2; border-radius: 10px; padding: 3px; gap: 3px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <button aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
          </sc-for>
        </div>
      </div>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <span id="{{t.id}}" style="font-size: 14px">{{t.label}}</span>
          <button role="switch" aria-checked="{{t.on}}" aria-labelledby="{{t.id}}" onClick="{{t.flip}}" style="{{t.track}}"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; display: block"></span></button>
        </div>
      </sc-for>
    </section>

    <section aria-label="Account" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 0 14px; display: flex; flex-direction: column">
      <button style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; min-height: 44px; border: 0; background: transparent; font-family: inherit; cursor: pointer; text-align: left">
        <span style="font-size: 14px; font-weight: 500; color: #9A4A10">Log out</span>
      </button>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'en', meal: true, due: true, close: false };
  }
  renderVals() {
    const s = this.state;
    const segOn = 'min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit';
    const segOff = 'min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #5B6461; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit';
    const langs = [['en', 'English'], ['bn', 'বাংলা']].map(([k, label]) => ({
      label, on: s.lang === k ? 'true' : 'false', style: s.lang === k ? segOn : segOff,
      pick: () => this.setState({ lang: k })
    }));
    const track = (on) => 'width: 48px; height: 30px; flex-shrink: 0; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#0E6656' : '#B9B6AC');
    const toggles = [['meal', 'Remind me to log meals'], ['due', 'Tell me when I owe money'], ['close', 'Tell me when a month is closed']].map(([k, label]) => ({
      id: 'pref-' + k, label, on: s[k] ? 'true' : 'false', track: track(s[k]),
      flip: () => this.setState({ [k]: !s[k] })
    }));
    return { langs, toggles };
  }
}
</script>
</body>
</html>
