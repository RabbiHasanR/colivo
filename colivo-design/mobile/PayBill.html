<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I paid a bill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column">
  <header style="padding: 12px 20px 10px; display: flex; flex-direction: column; gap: 6px">
    <a href="MemberHome.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Home</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">I paid a bill</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums">
    <section aria-label="Bill" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 600">Service charge <span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #EFEDFF; color: #4B3FA3">Postpaid</span></span>
          <span style="font-size: 12px; color: #5B6461">Due 5 Nov · you were given ৳581 for it</span>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; color: #5B6461">Amount you actually paid</span>
        <div style="display: flex; align-items: center; background: #F6F5F0; border-radius: 10px">
          <button type="button" aria-label="Less by ৳10" onClick="{{minus}}" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #17201D">−</button>
          <span style="min-width: 70px; text-align: center; font-size: 17px; font-weight: 600">৳{{amountText}}</span>
          <button type="button" aria-label="More by ৳10" onClick="{{plus}}" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #0E6656">+</button>
        </div>
      </div>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 12px; color: #5B6461; padding: 0; margin-bottom: 8px">Paid from</legend>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <div style="background: {{hintBg}}; color: {{hintFg}}; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45">{{hint}}</div>
      <button type="button" style="height: 64px; border-radius: 10px; border: 1.5px dashed #9A4A10; background: #FFFFFF; color: #7A3A0C; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">+ Receipt, screenshot or photo (required)</button>
      <button type="submit" style="{{saveStyle}}">{{saveLabel}}</button>
    </section>

    <section style="background: #FFFFFF; border: 1px dashed #C9C6BB; border-radius: 14px; padding: 12px 14px; font-size: 12px; color: #5B6461; line-height: 1.5">Everyone, including the owner, manager and fund keeper, is also a member and uses this same screen when they pay a bill themselves.</section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: 581, src: 'given' };
  }
  renderVals() {
    const GIVEN = 581;
    const s = this.state;
    const a = s.amount;
    const fmt = (n) => n.toLocaleString('en-US');
    const on = 'min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #0E6656; background: #E3F0EC; color: #0E6656; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; text-align: left';
    const off = 'min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; text-align: left';
    const sources = [['given', 'Money given to me (৳' + GIVEN + ')'], ['both', 'Given money + my pocket'], ['pocket', 'All from my pocket']].map(([k, label]) => ({
      label, on: s.src === k ? 'true' : 'false', style: s.src === k ? on : off,
      pick: () => this.setState({ src: k })
    }));
    let hint, blocked = false;
    if (s.src === 'pocket') {
      hint = 'You\'ll be credited ৳' + fmt(a) + '. Return the ৳' + GIVEN + ' you were given to the home fund.';
    } else if (s.src === 'given') {
      if (a > GIVEN) { blocked = true; hint = 'You were given only ৳' + GIVEN + '. Choose "Given money + my pocket" to pay the extra ৳' + fmt(a - GIVEN) + ' yourself.'; }
      else hint = a < GIVEN ? 'Bill marked paid. Return the leftover ৳' + fmt(GIVEN - a) + ' to the home fund.' : 'Bill marked paid with the money you were given.';
    } else {
      const fromGiven = Math.min(a, GIVEN);
      const fromPocket = a - fromGiven;
      hint = '৳' + fmt(fromGiven) + ' from the given money' + (fromPocket > 0 ? ' + ৳' + fmt(fromPocket) + ' from your pocket. You\'ll be credited ৳' + fmt(fromPocket) + '.' : '. Nothing from your pocket.');
    }
    return {
      sources,
      amountText: fmt(a),
      plus: () => this.setState({ amount: a + 10 }),
      minus: () => this.setState({ amount: Math.max(10, a - 10) }),
      hint,
      hintBg: blocked ? '#FBEFE3' : '#F1F0EA',
      hintFg: blocked ? '#7A3A0C' : '#3E4744',
      saveLabel: blocked ? 'Can\'t save: not enough given money' : 'Send for confirmation',
      saveStyle: 'height: 48px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit; ' + (blocked ? 'background: #D6D3C9; color: #3E4744; cursor: not-allowed' : 'background: #0E6656; color: #FFFFFF; cursor: pointer')
    };
  }
}
</script>
</body>
</html>
