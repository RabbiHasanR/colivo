<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add groceries as a member</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6656}a:hover{color:#0A4E42}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F0; font-family: Inter, system-ui, sans-serif; color: #17201D; display: flex; flex-direction: column">
  <header style="padding: 20px 20px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #5B6461">October 2026</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Add groceries</h1>
    </div>
    <div role="tablist" aria-label="Who is adding" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #ECEAE2; border-radius: 12px; padding: 4px; gap: 4px">
      <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{v.on}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums">
    <form aria-label="Add grocery entry" style="background: #FFFFFF; border: 1px solid #E3E1D9; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; color: #5B6461">Amount</span>
        <div style="display: flex; align-items: center; background: #F6F5F0; border-radius: 10px">
          <button type="button" aria-label="Less by ৳50" onClick="{{minus}}" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #17201D">−</button>
          <span style="min-width: 76px; text-align: center; font-size: 17px; font-weight: 600">৳{{amountText}}</span>
          <button type="button" aria-label="More by ৳50" onClick="{{plus}}" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #0E6656">+</button>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B6461">Items
        <input type="text" value="Potatoes, onions, eggs" style="height: 44px; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 12px; font-size: 15px; color: #17201D; font-family: inherit; box-sizing: border-box">
      </label>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <legend style="font-size: 12px; color: #5B6461; padding: 0; margin-bottom: 6px">Paid from</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <button type="button" style="height: 64px; border-radius: 10px; border: 1.5px dashed #9A4A10; background: #FFFFFF; color: #7A3A0C; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">+ Receipt, screenshot or photo (required)</button>
      <div style="background: {{hintBg}}; color: {{hintFg}}; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45">{{hint}}</div>
      <button type="submit" style="{{saveStyle}}">{{saveLabel}}</button>
    </form>

    <section aria-label="Rule" style="background: #FFFFFF; border: 1px dashed #C9C6BB; border-radius: 14px; padding: 12px 14px; font-size: 12px; color: #5B6461; line-height: 1.5">{{rule}}</section>
  </main>

  <nav aria-label="Main" style="height: 68px; background: #FFFFFF; border-top: 1px solid #E3E1D9; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="{{homeHref}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Meals.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Meals</a>
    <a href="MemberBazar.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E6656; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16l-2 10H6z"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="16" cy="20" r="1.4"></circle><path d="M4 6L3 3"></path></svg>Groceries</a>
    <a href="MyBill.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6461; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>My bill</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'member', amount: 450, mSource: 'given', kSource: 'box' };
  }
  renderVals() {
    const s = this.state;
    const GIVEN = 500;
    const BOX = 140;
    const fmt = (n) => n.toLocaleString('en-US');
    const tabOn = 'height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit';
    const tabOff = 'height: 40px; border: 0; border-radius: 9px; background: transparent; color: #5B6461; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit';
    const on = 'min-height: 52px; padding: 4px 8px; border-radius: 10px; border: 1.5px solid #0E6656; background: #E3F0EC; color: #0E6656; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; line-height: 1.3';
    const off = 'min-height: 52px; padding: 4px 8px; border-radius: 10px; border: 1px solid #D6D3C9; background: #FFFFFF; color: #17201D; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; line-height: 1.3';
    const isKeeper = s.view === 'keeper';
    const views = [['member', 'Member (Maruf)'], ['keeper', 'Fund keeper (Hijam)']].map(([k, label]) => ({
      label, on: s.view === k ? 'true' : 'false', style: s.view === k ? tabOn : tabOff,
      pick: () => this.setState({ view: k })
    }));
    const srcKey = isKeeper ? 'kSource' : 'mSource';
    const options = isKeeper
      ? [['box', 'Grocery fund (৳' + BOX + ' in it)'], ['pocket', 'My pocket']]
      : [['given', 'Money given to me (৳' + GIVEN + ')'], ['pocket', 'My pocket']];
    const sources = options.map(([k, label]) => ({
      label, on: s[srcKey] === k ? 'true' : 'false', style: s[srcKey] === k ? on : off,
      pick: () => this.setState({ [srcKey]: k })
    }));
    const src = s[srcKey];
    const a = s.amount;
    let hint, blocked = false;
    if (src === 'pocket') {
      hint = 'You\'ll be credited ৳' + fmt(a) + '. It counts toward the cost per meal.';
    } else if (isKeeper) {
      if (a > BOX) { blocked = true; hint = 'The grocery fund has only ৳' + BOX + '. Spend ৳' + BOX + ' from the grocery fund and ৳' + fmt(a - BOX) + ' from your pocket, or ask members to put money in first.'; }
      else hint = 'Taken from the grocery fund. ৳' + (BOX - a) + ' will be left. No credit to you.';
    } else {
      if (a > GIVEN) { blocked = true; hint = 'You were given only ৳' + GIVEN + '. Record ৳' + GIVEN + ' from it and ৳' + fmt(a - GIVEN) + ' from your pocket.'; }
      else hint = 'Taken from the ৳' + GIVEN + ' Hijam gave you. ৳' + (GIVEN - a) + ' left; return it to the grocery fund when you\'re done.';
    }
    return {
      views,
      sources,
      amountText: fmt(a),
      plus: () => this.setState({ amount: a + 50 }),
      minus: () => this.setState({ amount: Math.max(50, a - 50) }),
      hint,
      hintBg: blocked ? '#FBEFE3' : '#F1F0EA',
      hintFg: blocked ? '#7A3A0C' : '#3E4744',
      saveLabel: blocked ? 'Can\'t save: not enough money' : 'Send for confirmation',
      saveStyle: 'height: 48px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit; ' + (blocked ? 'background: #D6D3C9; color: #3E4744; cursor: not-allowed' : 'background: #0E6656; color: #FFFFFF; cursor: pointer'),
      rule: isKeeper
        ? 'As fund keeper (or manager) you can spend straight from the grocery fund, but never more than what\'s in it. You can also give money from the grocery fund to a member who is shopping.'
        : 'Members can\'t take money from the grocery fund themselves. The fund keeper or manager gives you grocery money first, and you can spend only that much.',
      homeHref: isKeeper ? 'KeeperHome.html' : 'MemberHome.html'
    };
  }
}
</script>
</body>
</html>
