# Backend checks (specs/tech-stack.md → Validation): runs when the backend,
# the API contract or this workflow changes. The same `make` targets as a
# local run.
name: Backend

on:
  push:
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: colivo
          # Throwaway password for a container that only lives for this job.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: colivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colivo -d colivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://colivo:ci-only@localhost:5432/colivo
      TEST_DATABASE_URL: postgresql+psycopg://colivo:ci-only@localhost:5432/colivo_test
      REDIS_URL: redis://localhost:6379/0
      BACKEND_CORS_ORIGINS: http://localhost:4200

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Service containers can't mount the repo's init script
      # (infra/postgres/init/), so the test database is created here.
      - name: Create the test database
        run: psql "postgresql://colivo:ci-only@localhost:5432/colivo" -c "CREATE DATABASE colivo_test"

      - name: Install (lockfile must be current)
        working-directory: backend
        run: uv sync --locked

      - name: Fast tests
        run: make backend-test-fast

      - name: Lint (Ruff, pyright)
        run: make backend-lint

      - name: Format (Ruff)
        run: make backend-format-check

      - name: No missing migration (alembic check)
        run: make backend-migrations-check

      - name: API contract is up to date
        run: |
          make api-export
          git diff --exit-code api/
