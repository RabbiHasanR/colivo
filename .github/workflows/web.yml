# Web checks (specs/tech-stack.md → Validation): runs when the web app, the
# API contract or this workflow changes. The same `make` targets as a local
# run. End-to-end tests need the whole stack and run locally (`make test`).
name: Web

on:
  push:
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version from web/package.json → packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generated API types match the contract
        run: |
          make api-types
          git diff --exit-code web/app/data/types/

      - name: Fast tests (headless Chrome)
        run: make web-test-fast

      - name: Lint (ESLint, template lint, Stylelint, Glint)
        run: make web-lint

      - name: Format (Prettier)
        run: make web-format-check

      - name: Build
        working-directory: web
        run: pnpm build
