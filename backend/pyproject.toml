[project]
name = "colivo-backend"
version = "0.1.0"
description = "Colivo REST API: meals, groceries, rent and bills for shared homes."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "phonenumbers>=9.0.44",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify,
# N naming, ANN type hints on every signature, D Google docstrings, RUF ruff.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "ANN", "D", "RUF"]
# D100/D104: no docstring required on modules and packages.
# D105/D107: none on magic methods and __init__.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.flake8-annotations]
# Pass-through wrappers (CoreRouter) forward *args/**kwargs as Any.
allow-star-arg-any = true

[tool.ruff.lint.isort]
# backend/alembic/ is the migrations folder, not the package.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use GIVEN / WHEN / THEN docstrings (specs/testing.md), not Google style.
"tests/**" = ["D"]
# Migrations are generated.
"alembic/**" = ["D"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests", "alembic"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
# A deprecation fails the run, so an outdated pattern (ours or a library's
# API we call) shows up the day a dependency is upgraded.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
markers = [
    "slow: end-to-end tests over real HTTP against docker compose (not in test-fast)",
]
